<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>任选其三</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --panel: #ffffff;
      --text: #17202a;
      --muted: #687385;
      --line: #dce2ea;
      --primary: #1f7a5a;
      --primary-dark: #166047;
      --accent: #d8583f;
      --disabled: #aeb7c4;
      --shadow: 0 18px 42px rgba(22, 32, 42, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 28px 16px;
    }

    main {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 24px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 28px;
      font-weight: 800;
    }

    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .count {
      min-width: 112px;
      text-align: right;
      color: var(--muted);
      font-weight: 700;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 10px;
      margin: 18px 0 20px;
    }

    .num {
      height: 74px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f9fbfc;
      color: var(--text);
      font-size: 26px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, background 120ms ease;
    }

    .num:hover {
      transform: translateY(-1px);
      border-color: #9bb5aa;
    }

    .num.off {
      background: #edf1f5;
      color: var(--disabled);
      text-decoration: line-through;
    }

    .num.hit {
      background: #dbf3ea;
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 140px;
      gap: 10px;
    }

    button {
      height: 48px;
      border: 0;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary {
      background: var(--primary);
      color: #fff;
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      background: #243142;
      color: #fff;
    }

    .reset {
      background: #e8edf3;
      color: #283647;
    }

    .result {
      display: grid;
      grid-template-columns: 1fr 220px;
      gap: 14px;
      margin-top: 20px;
    }

    .box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 124px;
      background: #fbfcfd;
    }

    .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .picked {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 26px;
      font-weight: 900;
    }

    .updown {
      display: grid;
      place-items: center;
      min-height: 72px;
      border-radius: 8px;
      background: #fff1ed;
      color: var(--accent);
      font-size: 34px;
      font-weight: 900;
    }

    .warn {
      margin-top: 12px;
      color: var(--accent);
      min-height: 22px;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      main {
        padding: 18px;
      }

      header,
      .result {
        grid-template-columns: 1fr;
        display: grid;
      }

      .count {
        text-align: left;
      }

      .board {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>任选其三</h1>
        <p>点击数字可取消或恢复，随机时只会从未取消的数字里抽取。</p>
      </div>
      <div class="count" id="count">可选 12 个</div>
    </header>

    <section class="board" id="board" aria-label="数字选择区"></section>

    <section class="actions">
      <button class="primary" id="pickThree">随机选 3 个</button>
      <button class="secondary" id="pickSide">随机上/下</button>
      <button class="reset" id="reset">全部恢复</button>
    </section>

    <section class="result">
      <div class="box">
        <div class="label">数字结果</div>
        <div class="picked" id="picked"></div>
      </div>
      <div class="box">
        <div class="label">上/下结果</div>
        <div class="updown" id="side">-</div>
      </div>
    </section>

    <div class="warn" id="warn"></div>
  </main>

  <script>
    const numbers = Array.from({ length: 12 }, (_, index) => index + 1);
    const disabled = new Set();
    let latest = [];

    const board = document.getElementById("board");
    const count = document.getElementById("count");
    const picked = document.getElementById("picked");
    const side = document.getElementById("side");
    const warn = document.getElementById("warn");

    numbers.forEach((number) => {
      const button = document.createElement("button");
      button.className = "num";
      button.type = "button";
      button.textContent = number;
      button.dataset.number = number;
      button.addEventListener("click", () => toggleNumber(number));
      board.appendChild(button);
    });

    document.getElementById("pickThree").addEventListener("click", pickThree);
    document.getElementById("pickSide").addEventListener("click", pickSide);
    document.getElementById("reset").addEventListener("click", resetAll);

    function toggleNumber(number) {
      if (disabled.has(number)) {
        disabled.delete(number);
      } else {
        disabled.add(number);
      }
      latest = latest.filter((item) => item !== number);
      render();
    }

    function pickThree() {
      const available = numbers.filter((number) => !disabled.has(number));
      if (available.length < 3) {
        warn.textContent = "剩余数字少于 3 个，先恢复一些数字。";
        latest = [];
        render();
        return;
      }
      latest = shuffle(available).slice(0, 3).sort((a, b) => a - b);
      warn.textContent = "";
      render();
    }

    function pickSide() {
      side.textContent = Math.random() < 0.5 ? "上" : "下";
      warn.textContent = "";
    }

    function resetAll() {
      disabled.clear();
      latest = [];
      side.textContent = "-";
      warn.textContent = "";
      render();
    }

    function shuffle(items) {
      const result = [...items];
      for (let index = result.length - 1; index > 0; index -= 1) {
        const next = Math.floor(Math.random() * (index + 1));
        [result[index], result[next]] = [result[next], result[index]];
      }
      return result;
    }

    function render() {
      document.querySelectorAll(".num").forEach((button) => {
        const number = Number(button.dataset.number);
        button.classList.toggle("off", disabled.has(number));
        button.classList.toggle("hit", latest.includes(number));
      });
      count.textContent = `可选 ${12 - disabled.size} 个`;
      picked.innerHTML = "";
      latest.forEach((number) => {
        const item = document.createElement("div");
        item.className = "pill";
        item.textContent = number;
        picked.appendChild(item);
      });
      if (!latest.length) {
        const empty = document.createElement("p");
        empty.textContent = "还没有随机结果";
        picked.appendChild(empty);
      }
    }

    render();
  </script>
</body>
</html>
